name: Release macOS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build hotkey helper
        run: npm run build:hotkey

      # Before Apple signing secrets exist this creates unsigned release assets.
      # After the secrets are added, electron-builder signs + notarizes the same build.
      - name: Build and publish
        run: |
          if [[ -n "${MAC_CSC_LINK:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "Developer ID signing enabled"
            npx electron-builder --mac --arm64 --publish always
          else
            echo "Unsigned transition build"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --publish always
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

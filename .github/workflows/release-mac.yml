name: Release macOS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish macOS release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo "No Developer ID certificate configured; building unsigned bootstrap release."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            echo "Developer ID certificate configured; signing is enabled."
          fi
          npm run release:mac

      - name: Show release artifacts
        if: always()
        run: |
          echo "Generated dist contents:"
          find dist -maxdepth 2 -type f -print 2>/dev/null || true

name: Release macOS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build macOS artifacts
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo "No Developer ID certificate configured; building unsigned bootstrap release."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npm run build:hotkey
            npx electron-builder --mac --arm64 --publish never -c.mac.notarize=false
          else
            echo "Developer ID certificate configured; signing/notarization enabled."
            npm run build:hotkey
            npx electron-builder --mac --arm64 --publish never
          fi

      - name: Publish one GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*-mac.zip
            dist/*-mac.zip.blockmap
            dist/latest-mac.yml
          )
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts found."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}"             --repo "$GITHUB_REPOSITORY"             --title "VoiceBridge ${GITHUB_REF_NAME#v}"             --generate-notes

      - name: Show release artifacts
        if: always()
        run: |
          echo "Generated dist contents:"
          find dist -maxdepth 2 -type f -print 2>/dev/null || true
